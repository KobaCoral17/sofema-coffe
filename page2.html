<!--REGISTRO DE EMPLEADOS-->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SOFEMA Cafetería - Registro de Empleado</title>
  <link rel="stylesheet" href="styles.css" />
  <script type="module" src="register.js" defer></script>
</head>
<body class="register-body">
  <div class="app-layout">
    <!-- Barra lateral izquierda decorativa -->
    <aside class="sidebar">
      <div class="logo-container">
        <div class="logo-icon">S</div>
      </div>
    </aside>

    <!-- Contenido principal -->
    <main class="main-content">
      <h1 class="form-title">Registro de empleado</h1>

      <form id="employeeForm" class="employee-form">
        <div class="form-grid">
          <!-- Campo: Nombre -->
          <div class="form-group">
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" required />
          </div>

          <!-- Campo: Correo -->
          <div class="form-group">
            <label for="correo">Correo:</label>
            <input type="email" id="correo" name="correo" required />
          </div>

          <!-- Campo: Número de teléfono -->
          <div class="form-group">
            <label for="telefono">Numero de telefono:</label>
            <input type="tel" id="telefono" name="telefono" required />
          </div>

          <!-- Campo: ID (Automático) -->
          <div class="form-group">
            <label for="empleadoId">ID (Automatico)</label>
            <input type="text" id="empleadoId" name="empleadoId" placeholder="Generado automáticamente" readonly />
          </div>

          <!-- Campo: Contraseña (Centrado) -->
          <div class="form-group full-width">
            <label for="password">Contraseña:</label>
            <input type="password" id="password" name="password" required />
          </div>
        </div>

        <!-- Marca de agua central -->
        <div class="watermark-container">
          <div class="watermark-logo">S</div>
          <p class="watermark-title">SOFEMA</p>
          <p class="watermark-subtitle">— CAFETERÍA —</p>
        </div>

        <!-- Leyenda informativa -->
        <div class="info-notice">
          <p>Se ha enviado un correo de bienvenida al empleado con sus credenciales.</p>
          <button type="button" id="closeNoticeBtn" class="link-btn">"Cerrar"</button>
        </div>

        <!-- Acciones principales -->
        <div class="form-actions">
          <button type="submit" class="btn btn-primary">
            <span class="icon">📋</span> Guardar registro
          </button>
          <!-- Botón Cancelar que regresa a index.html (Login) -->
          <a href="index.html" class="btn btn-secondary text-center">
            <span class="icon">🚫</span> Cancelar
          </a>
        </div>
      </form>
    </main>
  </div>
</body>
</html>
